[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-deerflow"
version = "0.1.0"
description = "Network traffic analysis agent built on the DeerFlow architecture (LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "sse-starlette>=2.0.0",
    "pandas>=2.2.3",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
